<!DOCTYPE html>
<html lang="zh-tw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Code Helper - PDF Viewer</title>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
	<link rel="stylesheet" href="web/styles.css">
</head>

<body>
	<div id="toolbar">
		<button onclick="selectPdfFile()">選擇 PDF 檔案</button>
		<button onclick="changePage(-1)">上一頁</button>
		<span>頁碼：<strong id="page-num">1</strong> / <span id="page-count">-</span></span>
		<button onclick="changePage(1)">下一頁</button>

		<span style="margin-left: 20px;"></span>
		<button onclick="zoom(-0.2)">─ 縮小</button>
		<span id="zoom-val">100%</span>
		<button onclick="zoom(0.2)">+ 放大</button>

		<button id="toggle-mark-btn" onclick="toggleMarkMode()">標記方框</button>
		<span id="mark-status" style="color: #ffca28; margin-left: 10px;"></span>

		<span style="margin-left: auto;" id="status-msg">載入 PDF 頁面中...</span>
	</div>
	<div id="pdf-container">
		<div id="canvas-wrapper">
			<canvas id="pdf-canvas"></canvas>
			<div id="highlight-layer"></div>
		</div>
	</div>

	<script src="web/main.js"></script>
</body>
</html>
